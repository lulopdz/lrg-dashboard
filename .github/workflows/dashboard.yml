name: Actualizar Dashboard DAM Diariamente

on:
  push:
    branches: [ main ] # Se ejecutará cada vez que subas código para que lo veas ya
  schedule:
    - cron: '0 10 * * *' # Se ejecutará todos los días a las 10:00 UTC (6:00 AM EDT)
  workflow_dispatch: # Permite disparar el workflow manualmente desde la pestaña Actions

# Los tres workflows (dashboard.yml, refresh_rtm.yml, predict.yml) comitean y publican a
# Pages -- si corren al mismo tiempo se pisan el push o la publicación. Este grupo
# compartido los encola en vez de dejarlos correr en paralelo (cancel-in-progress: false =
# esperan su turno, no se cancelan entre sí).
concurrency:
  group: lrg-dashboard-git-writes
  cancel-in-progress: false

permissions:
  contents: write # Necesario para que el bot pueda hacer commit y push del reporte
  pages: write
  id-token: write

jobs:
  actualizar-web:
    runs-on: ubuntu-latest
    
    steps:
    - name: Traer el código
      uses: actions/checkout@v4
      
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Instalar librerías
      run: pip install -r requirements.txt

    - name: Actualizar datos del DAM
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      run: python src/update_data.py

    - name: Actualizar datos del RTM
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      run: python src/update_rtm.py

    - name: Actualizar datos del clima
      run: python src/update_weather.py

    # Ensemble spread + run-to-run revisions for the Weather tab's confidence section.
    # Best-effort: a failure here must not block the dashboard, the data is supplementary.
    - name: Actualizar confianza del pronostico (Open-Meteo ensemble)
      continue-on-error: true
      run: python src/update_weather_confidence.py

    - name: Actualizar pronóstico de demanda
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      run: python src/update_load_forecast.py

    - name: Actualizar pronóstico de viento
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      run: python src/update_wind_forecast.py

    - name: Guardar datos y regenerar dashboard
      run: |
        python src/parse_reports.py
        git config --local user.email "action@github.com"
        git config --local user.name "Bot de LRG"
        git add data/ieso_dam_prices.csv data/ieso_rtm_prices.csv data/OTTAWA_weather.csv data/weather_confidence.csv data/ieso_load_forecast.csv data/ieso_wind_forecast.csv data/historical_pnl.csv
        git commit -m "Reporte automático generado" || echo "Sin cambios nuevos"
        git pull --rebase origin main
        python src/generar_web.py
        python src/generar_simulator.py
        python src/generar_portfolio.py
        git push

    - name: Preparar artefacto de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  publicar:
    needs: actualizar-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publicar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4