name: Actualizar Dashboard DAM Diariamente

on:
  push:
    branches: [ main ] # Se ejecutará cada vez que subas código para que lo veas ya
  schedule:
    # Dos veces al día, y en minuto 23 a propósito: GitHub retrasa o directamente descarta
    # el evento schedule cuando hay carga alta, y el filo de la hora es el peor momento.
    # Dos disparos también dan margen si uno se cae, como pasó el 27/08/2026.
    - cron: '23 10 * * *' # 06:23 EDT: clima, carga, viento y adecuación del día
    - cron: '23 19 * * *' # 15:23 EDT / 14:23 EST: el IESO publica el DAM de mañana ~13:30 local,
                          # así que la corrida de la mañana nunca alcanzaba a traerlo
  workflow_dispatch: # Permite disparar el workflow manualmente desde la pestaña Actions

# Los tres workflows (dashboard.yml, refresh_rtm.yml, predict.yml) comitean y publican a
# Pages -- si corren al mismo tiempo se pisan el push o la publicación. Este grupo
# compartido los encola en vez de dejarlos correr en paralelo (cancel-in-progress: false =
# esperan su turno, no se cancelan entre sí).
concurrency:
  group: lrg-dashboard-git-writes
  cancel-in-progress: false

permissions:
  contents: write # Necesario para que el bot pueda hacer commit y push del reporte
  pages: write
  id-token: write

jobs:
  actualizar-web:
    runs-on: ubuntu-latest
    
    steps:
    - name: Traer el código
      uses: actions/checkout@v4
      
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Instalar librerías
      run: pip install -r requirements.txt

    - name: Actualizar datos del DAM
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_data.py

    # El RTM lo trae y comitea refresh_rtm.yml, que arranca encadenado al terminar este
    # workflow y tambien regenera y publica el sitio. Si este workflow tambien lo trajera,
    # los dos comitearian el mismo archivo y el rebase del que llegue segundo choca (ver la
    # nota de propiedad mas abajo). Aqui se lee el ieso_rtm_prices.csv ya comiteado, que
    # basta para regenerar.

    - name: Actualizar datos del clima
      continue-on-error: true
      run: python src/ingest/update_weather.py

    # Ensemble spread + run-to-run revisions for the Weather tab's confidence section.
    # Best-effort: a failure here must not block the dashboard, the data is supplementary.
    - name: Actualizar confianza del pronostico (Open-Meteo ensemble)
      continue-on-error: true
      run: python src/ingest/update_weather_confidence.py

    - name: Actualizar pronóstico de demanda
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_load_forecast.py

    - name: Actualizar pronóstico de viento
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_wind_forecast.py

    - name: Actualizar reporte de adecuación (mix de generación)
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_adequacy.py

    - name: Guardar datos y regenerar dashboard
      run: |
        python src/ingest/parse_reports.py
        git config --local user.email "action@github.com"
        git config --local user.name "Bot de LRG"
        # Un solo workflow es dueño de cada archivo. actions/checkout clona el commit que
        # disparó el run, no la punta de main, así que dos workflows que comiteen el mismo
        # archivo chocan en el rebase por mucho que el grupo de concurrency los encole: el
        # segundo ya clonó antes de entrar en la cola. Este es dueño de todo menos del RTM
        # (refresh_rtm.yml) y de los forecasts (predict.yml). historical_pnl.csv se queda
        # aquí porque depende de los reportes XML, no del RTM.
        git add data/ieso_dam_prices.csv data/OTTAWA_weather.csv data/weather_confidence.csv data/ieso_load_forecast.csv data/ieso_wind_forecast.csv data/ieso_adequacy.csv data/historical_pnl.csv
        git commit -m "Reporte automático generado" || echo "Sin cambios nuevos"
        git pull --rebase origin main
        python src/web/generar_web.py
        python src/web/generar_simulator.py
        python src/web/generar_portfolio.py
        git push

    - name: Preparar artefacto de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  publicar:
    needs: actualizar-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publicar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4