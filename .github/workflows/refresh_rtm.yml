name: Refrescar RTM

on:
  schedule:
    - cron: '0 10 * * *' # Mismo horario que el DAM: 10:00 UTC (6:00 AM EDT)
  workflow_dispatch: # Disparado por el botón "Refresh RTM" del dashboard, o manualmente desde Actions
    inputs:
      hours:
        description: 'Horas hacia atrás (vacío = detectar automáticamente desde el último dato guardado)'
        required: false
        default: ''

# Los tres workflows (dashboard.yml, refresh_rtm.yml, predict.yml) comitean a main y
# regeneran docs/index.html -- si corren al mismo tiempo, el segundo en subir choca al
# intentar fusionar ese HTML generado. Este grupo compartido los encola en vez de dejarlos
# pisarse (cancel-in-progress: false = esperan su turno, no se cancelan entre sí).
concurrency:
  group: lrg-dashboard-git-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refrescar-rtm:
    runs-on: ubuntu-latest

    steps:
    - name: Traer el código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar librerías
      run: pip install -r requirements.txt

    - name: Actualizar datos del RTM
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
        HOURS_INPUT: ${{ github.event.inputs.hours }}
      run: |
        if [ -n "$HOURS_INPUT" ]; then
          python src/update_rtm.py --hours "$HOURS_INPUT"
        else
          python src/update_rtm.py
        fi

    - name: Guardar datos y regenerar dashboard
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Bot de LRG"
        git add data/ieso_rtm_prices.csv
        git commit -m "RTM actualizado" || echo "Sin cambios nuevos"
        git pull --rebase origin main
        python src/generar_web.py
        git add docs/index.html
        git commit -m "Regenerar dashboard" || echo "Sin cambios nuevos"
        git push
