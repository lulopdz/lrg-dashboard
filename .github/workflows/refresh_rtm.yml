name: Refresh Real-Time

# Modalidad 2: bajo demanda, para seguir el mercado intradía. Trae los últimos intervalos RT
# publicados, recalcula spreads y el P&L del portafolio, y republica. Lo dispara el botón
# "Refresh Real-Time" del sitio (directo vía ops/refresh_trigger.gs si REFRESH_RT_URL está
# definida, si no desde la página de Actions). Cada clic gasta 1 request de GridStatus (el RT)
# de un cupo de 250 al mes; el DAM de mañana viene gratis de los reportes de IESO.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Horas hacia atrás (vacío = desde el último dato guardado)'
        required: false
        default: ''

concurrency:
  group: lrg-dashboard-git-writes
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refrescar:
    runs-on: ubuntu-latest

    steps:
    - name: Traer el código
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar librerías
      run: pip install -r requirements.txt

    - name: Mercado Real-Time (RT)
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
        HOURS_INPUT: ${{ github.event.inputs.hours }}
      run: |
        if [ -n "$HOURS_INPUT" ]; then
          python src/ingest/update_rtm.py --hours "$HOURS_INPUT"
        else
          python src/ingest/update_rtm.py
        fi

    # Si el RT vino vacío o viejo, mejor parar acá que publicar como si nada.
    - name: RT al día
      run: python src/ingest/check_freshness.py --max-hours 4

    # También el DAM de mañana, desde los reportes públicos de IESO (mismos valores que
    # GridStatus, 0 requests del cupo). IESO lo publica ~12:35 EST; antes de eso el script sale
    # con código 3 ("todavía no publicado"), que aquí no cuenta como error. Así un clic por la
    # tarde trae el DAM de mañana que la corrida de las 9:00 no podía ver.
    - name: Mercado Day-Ahead (DAM, IESO)
      continue-on-error: true
      run: python src/ingest/update_prices_ieso.py dam || [ $? -eq 3 ]

    - name: Portafolio y P&L
      run: python src/ingest/parse_reports.py

    - name: Guardar datos, regenerar y publicar
      env:
        REFRESH_RT_URL: ${{ vars.REFRESH_RT_URL }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Bot de LRG"
        git add data/ieso_rtm_prices.csv data/ieso_dam_prices.csv data/historical_pnl.csv
        git commit -m "Refresh Real-Time" || echo "Sin cambios nuevos"
        git pull --rebase origin main
        python src/web/generar_web.py
        python src/web/generar_simulator.py
        python src/web/generar_portfolio.py
        git push

    - name: Preparar artefacto de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  publicar:
    needs: refrescar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publicar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
