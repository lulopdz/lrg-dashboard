name: Actualización diaria

# Modalidad 1: pipeline completo una vez al día a las 9:00 hora de Ottawa. Un solo job hace
# todo en orden (DAM, clima, carga, viento, adecuación, RT, P&L, forecasts, sitio), así que no
# hay cadena de workflows ni carrera de rebase entre ellos.
#
# El disparo de las 9:00 en punto viene de afuera (ops/refresh_trigger.gs, Apps Script con
# zona horaria America/Toronto) vía workflow_dispatch. El cron de GitHub queda solo como
# respaldo: entre el 11 y el 17/09/2026 llegó 3 a 6 h tarde todos los días, y es UTC fijo,
# así que no puede seguir el cambio de horario de Ottawa.
#
# Presupuesto de API: GridStatus da 250 requests por mes y cada descarga completa gasta 5
# (DAM, RT, carga, viento, adecuación). El 20/09/2026 se agotó el cupo porque este workflow
# corría 3 o 4 veces al día: cron + Apps Script + cada push de un reporte. Por eso el paso
# "Decidir qué correr" apaga las descargas en los push (solo regeneran P&L y sitio) y en el
# cron cuando el Apps Script ya disparó hoy. Un cambio de código que necesite datos nuevos se
# corre a mano con "Run workflow" desde la página de Actions.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *' # 11:00 EDT / 10:00 EST: siempre después de las 9:00, para que actúe solo si el Apps Script no disparó
  push:
    branches: [ main ]

# Los dos workflows comitean y publican a Pages; el grupo compartido los encola en vez de
# dejarlos correr en paralelo. Ojo: GitHub solo mantiene UN pendiente por grupo, uno nuevo
# cancela al pendiente anterior.
concurrency:
  group: lrg-dashboard-git-writes
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read # para que el cron consulte si hoy ya hubo un run disparado a mano

jobs:
  actualizar:
    runs-on: ubuntu-latest
    outputs:
      descargo: ${{ steps.plan.outputs.descargar }}
      forecasts: ${{ steps.forecasts.outcome }}

    steps:
    - name: Traer el código
      uses: actions/checkout@v4
      with:
        ref: main # la punta de main al arrancar el job (ya pasada la cola), no el SHA que disparó el run

    - name: Decidir qué correr
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          push) descargar=false ;; # un reporte nuevo o un cambio de código solo necesitan P&L y sitio
          schedule)
            # Respaldo del Apps Script: descarga solo si hoy no hubo ningún run disparado por
            # workflow_dispatch (el de las 9:00 o uno a mano). Si la consulta falla, descarga.
            previos=$(gh run list --workflow daily.yml --event workflow_dispatch \
                        --created "$(date -u +%F)" --json databaseId --jq length || echo 0)
            if [ "${previos:-0}" -gt 0 ]; then descargar=false; else descargar=true; fi ;;
          *) descargar=true ;;
        esac
        echo "descargar=$descargar" >> "$GITHUB_OUTPUT"
        echo "Evento $GITHUB_EVENT_NAME -> descargar=$descargar"

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar librerías
      run: pip install -r requirements.txt

    # Descargas best-effort: una fuente caída no debe bloquear el resto del pipeline. El job
    # "verificar" de abajo es el que pone el run en rojo si el RT quedó viejo.
    - name: Mercado Day-Ahead (DAM)
      if: steps.plan.outputs.descargar == 'true'
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_data.py --skip-if-current # el de hoy suele estar desde el clic de ayer a la tarde

    - name: Mercado Real-Time (RT)
      if: steps.plan.outputs.descargar == 'true'
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_rtm.py

    - name: Clima
      if: steps.plan.outputs.descargar == 'true'
      continue-on-error: true
      run: python src/ingest/update_weather.py

    - name: Confianza del pronóstico (Open-Meteo ensemble)
      if: steps.plan.outputs.descargar == 'true'
      continue-on-error: true
      run: python src/ingest/update_weather_confidence.py

    - name: Pronóstico de demanda
      if: steps.plan.outputs.descargar == 'true'
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_load_forecast.py

    - name: Pronóstico de viento
      if: steps.plan.outputs.descargar == 'true'
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_wind_forecast.py

    - name: Adecuación (mix de generación)
      if: steps.plan.outputs.descargar == 'true'
      env:
        GRIDSTATUS_API_KEY: ${{ secrets.GRIDSTATUS_API_KEY }}
      continue-on-error: true
      run: python src/ingest/update_adequacy.py

    - name: Portafolio y P&L
      run: python src/ingest/parse_reports.py

    # Vintage "pre_dam": el DAM de mañana todavía no salió, así que RT y spread usan el DAM
    # pronosticado. OTTAWA alimenta el dashboard; TORONTO y NIAGARA se archivan con sufijo y son
    # best-effort (si fallan, OTTAWA sigue). La corrida post-DAM de la tarde (forecast_pm.yml)
    # repite RT y spread con el DAM real. continue-on-error para que un modelo roto no impida
    # guardar y publicar los datos recién bajados; el job "verificar" pone el run en rojo.
    - name: Forecasts DAM, RT y spread (pre-DAM)
      id: forecasts
      if: steps.plan.outputs.descargar == 'true' # sin datos nuevos solo agregarían filas repetidas al historial
      continue-on-error: true
      run: python src/forecast/run_forecasts.py --vintage pre_dam

    - name: Guardar datos, regenerar y publicar
      env:
        REFRESH_RT_URL: ${{ vars.REFRESH_RT_URL }}
        DESCARGAR: ${{ steps.plan.outputs.descargar }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Bot de LRG"
        git add data/
        if [ "$DESCARGAR" = true ]; then msg="Actualización diaria"; else msg="Regenerar P&L y sitio"; fi
        git commit -m "$msg" || echo "Sin cambios nuevos"
        git pull --rebase origin main # red de seguridad por si alguien pusheó a mano mientras corría
        python src/web/generar_web.py
        python src/web/generar_simulator.py
        python src/web/generar_portfolio.py
        git push

    - name: Preparar artefacto de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publicar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # Corre en paralelo con "publicar": si el RT quedó viejo o fallaron los forecasts pone el run
  # en rojo (y GitHub manda el mail de fallo) sin frenar el sitio, que igual sale con lo que sí
  # se actualizó. Sin esto, el 403 de GridStatus del 20/09/2026 quedó escondido detrás de
  # continue-on-error y el run salió verde un día entero.
  verificar:
    needs: actualizar
    if: needs.actualizar.outputs.descargo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Traer los datos recién publicados
      uses: actions/checkout@v4
      with:
        ref: main
    - name: RT al día
      run: python3 src/ingest/check_freshness.py --max-hours 4
    - name: Forecasts OK
      if: always() && needs.actualizar.outputs.forecasts == 'failure'
      run: |
        echo "::error::Los forecasts pre-DAM fallaron (ver el paso 'Forecasts' del job actualizar); el sitio salió con los de ayer."
        exit 1
