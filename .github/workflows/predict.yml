name: Predicciones DAM/RTM/Spread

on:
  schedule:
    - cron: '30 10 * * *' # 30 min después del refresco diario de datos (10:00 UTC), para correr ya con carga/viento/clima/DAM frescos
  workflow_dispatch: # Disparado por el botón "Refresh Forecasts" del dashboard, o manualmente desde Actions

# Los tres workflows (dashboard.yml, refresh_rtm.yml, predict.yml) comitean y publican a
# Pages -- si corren al mismo tiempo se pisan el push o la publicación. Este grupo
# compartido los encola en vez de dejarlos correr en paralelo (cancel-in-progress: false =
# esperan su turno, no se cancelan entre sí).
concurrency:
  group: lrg-dashboard-git-writes
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  predecir:
    runs-on: ubuntu-latest

    steps:
    - name: Traer el código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar librerías
      run: pip install -r requirements.txt

    - name: Predecir DAM de mañana
      run: python src/predict_dam.py

    - name: Predecir RTM de mañana
      run: python src/predict_rtm.py

    - name: Predecir Spread de mañana
      run: python src/predict_spread.py

    - name: Guardar predicciones y regenerar dashboard
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Bot de LRG"
        git add data/dam_forecast.csv data/dam_forecast_meta.json data/rtm_forecast.csv data/rtm_forecast_meta.json data/spread_forecast.csv data/spread_forecast_meta.json
        git commit -m "Predicciones actualizadas" || echo "Sin cambios nuevos"
        git pull --rebase origin main
        python src/generar_web.py
        python src/generar_simulator.py
        python src/generar_portfolio.py
        git push

    - name: Preparar artefacto de Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  publicar:
    needs: predecir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publicar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
